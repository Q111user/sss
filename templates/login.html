<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Admin Giriş</title></head>
  <body>
    <h2>Admin Giriş</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
        {% for cat, msg in messages %}
          <li><strong>{{ cat }}:</strong> {{ msg }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <form method="post">
      <label>Kullanıcı: <input name="username" value="admin"></label><br>
      <label>Parola: <input type="password" name="password"></label><br>
      <button type="submit">Giriş</button>
    </form>
  </body>
</html>
